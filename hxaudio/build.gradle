plugins {
    id 'com.android.library'
}

android {
    namespace 'com.huhx0015.hxaudio'
    compileSdk 37

    defaultConfig {
        minSdk 9
        targetSdk 27
        versionCode 23
        versionName "3.3.1"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}